<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wassel AI</title>
<meta name="description" content="Wassel AI | AI customer service, WhatsApp marketing and email marketing for fabric, carpet and flooring companies in the UAE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F3F7FC; --surface:#FFFFFF; --surface2:#F8FAFD;
  --line:#E3E9F4; --ink:#101B33; --muted:#55607A;
  --purple:#2563EB; --purple-d:#1D4ED8; --blue:#3B82F6; --cyan:#06B6D4;
  --green:#10B981; --red:#EF4444; --amber:#F59E0B;
  --dark:#0A1430; --dark2:#12214A;
  --r:22px; --shadow:0 24px 60px -28px rgba(30,64,175,.35); --nav-h:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
body{font-family:'Readex Pro','Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:'Montserrat','Readex Pro',system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:0}
svg{max-width:100%}
.container{width:min(1160px,92%);margin-inline:auto}
section{padding:clamp(60px,8vw,104px) 0;position:relative}
section.alt{background:var(--bg2)}
h1,h2,h3{line-height:1.35;color:var(--ink)}
h1{font-size:clamp(30px,5vw,58px);font-weight:700}
h2{font-size:clamp(25px,3.4vw,42px);font-weight:700}
h3{font-size:clamp(16px,1.8vw,19px);font-weight:600}
html[lang="en"] h1,html[lang="en"] h2{letter-spacing:-.02em;line-height:1.2}
html[lang="en"] h1{font-size:clamp(29px,4.5vw,52px)}
html[lang="en"] h2{font-size:clamp(24px,3.1vw,37px)}
.grad{background:linear-gradient(100deg,#2563EB,#3B82F6 60%,#06B6D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(15px,1.5vw,18px);color:var(--muted);max-width:660px;font-weight:300}
.kicker{display:inline-block;font-size:13px;font-weight:600;color:var(--purple-d);background:#E6EFFD;border:1px solid #CFE0FC;padding:6px 14px;border-radius:99px;margin-bottom:16px}
.skip{position:absolute;top:8px;inset-inline-start:8px;transform:translateY(-300%);background:var(--dark);color:#fff;padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{transform:none}
.head{margin-bottom:44px}.head.center{text-align:center}.head.center .lead{margin-inline:auto;margin-top:14px}
.head h2{margin-top:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:14px;font-weight:600;font-size:15px;transition:.25s;border:1px solid transparent;text-align:center}
.btn-primary{background:linear-gradient(135deg,#2563EB,#0E7490);color:#fff;box-shadow:0 12px 30px -10px rgba(37,99,235,.7)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 38px -10px rgba(37,99,235,.8)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple-d)}
.btn-sm{padding:9px 18px;font-size:14px;border-radius:12px}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}

/* nav */
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s}
.nav.scrolled{border-color:var(--line);box-shadow:0 8px 30px -20px rgba(30,64,175,.35)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;font-family:'Montserrat',sans-serif}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0A1430,#15337E);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 0 18px -2px rgba(37,99,235,.7)}
.links{display:flex;gap:26px}
.links a{font-size:14.5px;font-weight:500;color:var(--muted);transition:.2s}.links a:hover{color:var(--purple-d)}
.nav-actions{display:flex;align-items:center;gap:10px}
.lang{padding:8px 14px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:600;background:#fff}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;position:relative;background:#fff}
.burger span,.burger span::before,.burger span::after{position:absolute;content:"";width:18px;height:2px;background:var(--ink);inset-inline-start:11px;transition:.25s}
.burger span{top:19px}.burger span::before{top:-6px;inset-inline-start:0}.burger span::after{top:6px;inset-inline-start:0}
.nav.open .burger span{background:transparent}.nav.open .burger span::before{top:0;transform:rotate(45deg)}.nav.open .burger span::after{top:0;transform:rotate(-45deg)}
.mnav{display:none;position:fixed;top:var(--nav-h);inset-inline:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 5% 20px;z-index:99;flex-direction:column;gap:4px;box-shadow:0 20px 40px -20px rgba(0,0,0,.2)}
.mnav a{padding:12px 4px;font-weight:500;border-bottom:1px solid var(--line)}.mnav a.btn{margin-top:12px;border:0}
.nav.open+.mnav{display:flex}

/* ICON TILES (new identity: dark glowing tile, light line icon) */
.tile{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:15px;flex:none;position:relative;background:linear-gradient(145deg,#12214A,#0A1430);border:1px solid rgba(59,130,246,.45);box-shadow:0 10px 24px -8px rgba(30,64,175,.6),inset 0 0 14px rgba(59,130,246,.25)}
.tile svg{width:24px;height:24px;fill:none;stroke:#93C5FD;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(96,165,250,.9))}
.tile.t-blue svg{stroke:#7DD3FC;filter:drop-shadow(0 0 5px rgba(96,165,250,.9))}
.tile.t-cyan svg{stroke:#5EEAD4;filter:drop-shadow(0 0 5px rgba(34,211,238,.9))}
.tile.lg{width:60px;height:60px;border-radius:19px}.tile.lg svg{width:30px;height:30px}
.tile.mb{margin-bottom:16px}

/* HERO */
.hero{padding-top:clamp(40px,6vw,80px);background:radial-gradient(60% 50% at 85% 0,#E0ECFF 0,transparent 70%),radial-gradient(45% 40% at 0 30%,#E3F4FB 0,transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{margin-bottom:18px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.trust{font-size:13.5px;color:var(--muted)}
.orbit{position:relative;min-height:460px;display:grid;place-items:center}
.fl{position:absolute;z-index:3;animation:float 6s ease-in-out infinite}
.f1{top:2%;inset-inline-start:2%}.f2{top:16%;inset-inline-end:0;animation-delay:-1s}.f3{bottom:8%;inset-inline-start:-2%;animation-delay:-2s}.f4{bottom:6%;inset-inline-start:4%;animation-delay:-3s}.f5{top:46%;inset-inline-start:-4%;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-12px)}}
.sim-tag{position:absolute;top:0;inset-inline-end:14%;z-index:4;font-size:11.5px;font-weight:600;background:#fff;border:1px dashed #93C5FD;color:var(--purple-d);padding:3px 10px;border-radius:99px}
.wa{width:min(330px,82%);background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative;z-index:2}
.wa-top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#075E54;color:#fff}
.wa-top small{display:block;font-size:11.5px;opacity:.8;font-weight:300}
.wa-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#3B82F6);display:grid;place-items:center;font-weight:700;font-family:'Montserrat',sans-serif;flex:none}
.chat{padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px;min-height:300px}
.msg{max-width:84%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-line;animation:pop .4s both;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111}
.msg.c{background:#fff;align-self:flex-start;border-top-inline-start-radius:3px}
.msg.b{background:#D9FDD3;align-self:flex-end;border-top-inline-end-radius:3px}
.msg.sys{align-self:center;max-width:92%;background:#FFF3C4;font-size:12px;text-align:center;border-radius:99px;padding:5px 14px;color:#6B5200}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.po-thumb{display:block;height:58px;border-radius:8px;margin-bottom:6px;background:repeating-linear-gradient(0deg,#E4E9F3 0 6px,#fff 6px 12px)}
.order-card{position:absolute;z-index:3;bottom:3%;inset-inline-end:-2%;width:215px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);animation:float 7s ease-in-out infinite;animation-delay:-2s}
.order-card h4{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;margin-bottom:8px}
.order-card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0}.order-card .row b{color:var(--ink);font-weight:600}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.wait{background:#FEF3C7;color:#92400E}.pill.ok{background:#D1FAE5;color:#065F46}.pill.no{background:#FEE2E2;color:#991B1B}.pill.mk{background:#E6EFFD;color:var(--purple-d)}
.mini-actions{display:flex;gap:6px;margin-top:10px}
.mini-actions span{flex:1;text-align:center;font-size:12px;font-weight:600;padding:6px;border-radius:9px}
.mini-actions .y{background:#D1FAE5;color:#065F46}.mini-actions .n{background:#FEE2E2;color:#991B1B}

/* STRIP */
.strip{background:linear-gradient(180deg,#fff,#EEF4FC);overflow:hidden;padding-block:70px 60px}
.wave{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.strip .container{position:relative;z-index:2;text-align:center}
.track{font-size:clamp(20px,3vw,32px);font-weight:600;margin-bottom:34px}
.steps3{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,48px);flex-wrap:wrap}
.s3{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#12214A,#0A1430);border:1.5px solid rgba(59,130,246,.7);box-shadow:0 0 0 7px rgba(59,130,246,.12),0 14px 30px -10px rgba(30,64,175,.7);position:relative}
.ring svg{width:34px;height:34px;fill:none;stroke:#93C5FD;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(96,165,250,.95))}
.ring.t-cyan svg{stroke:#67E8F9}.ring.t-blue svg{stroke:#93C5FD}
.arr{width:46px;height:2px;background:linear-gradient(90deg,#2563EB,#06B6D4);position:relative;border-radius:2px;overflow:hidden}
.arr::after{content:"";position:absolute;inset:0;width:30%;background:#fff;opacity:.8;animation:run 1.8s linear infinite}
@keyframes run{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
[dir=rtl] .arr{transform:scaleX(-1)}

/* cards & grids */
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#BFD3F7}
.card p{color:var(--muted);font-size:14.5px;margin-top:8px;font-weight:300}
.ftop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:16px}
.badge{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge.live{background:#D1FAE5;color:#065F46}.badge.cfg{background:#DBEAFE;color:#1E40AF}.badge.plan{background:#FEF3C7;color:#92400E}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:28px;font-size:13.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.step .n{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#12214A,#0A1430);color:#93C5FD;display:grid;place-items:center;font-weight:700;margin-bottom:14px;box-shadow:0 0 16px -2px rgba(37,99,235,.6);font-family:'Montserrat',sans-serif}
.step p{color:var(--muted);font-size:14.5px;margin-top:6px;font-weight:300}
.benefit{display:flex;gap:16px;align-items:flex-start}

/* modules overview */
.mods .card{display:flex;flex-direction:column}
.mods .card .go{margin-top:auto;padding-top:18px;font-weight:600;color:var(--purple-d);font-size:14px}
.mods .card.hl{border-color:#B4CCF6;background:linear-gradient(180deg,#fff,#F3F7FE)}

/* DEMO / MARKETING shared */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.tab{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;transition:.2s}
.tab:hover{border-color:var(--purple)}
.tab[aria-selected=true]{background:linear-gradient(135deg,#2563EB,#0E7490);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(37,99,235,.8)}
.demo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;max-width:960px;margin-inline:auto}
.demo-chat{border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.demo-chat .chat{min-height:360px}
.demo-side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px}
.demo-side h3{margin-bottom:14px}
.actions{list-style:none;display:flex;flex-direction:column;gap:10px}
.actions li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#8E99B0;transition:.4s}
.actions li i{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #D3DBEA;display:grid;place-items:center;font-style:normal;font-size:12px;color:transparent;transition:.4s}
.actions li.on{color:var(--ink)}.actions li.on i{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.replay{margin-top:18px}.note{font-size:13px;color:var(--muted);margin-top:14px;font-weight:300}
.demo{background:linear-gradient(180deg,#fff,#F3F7FC)}

/* orders flow */
.flow{display:flex;justify-content:center;align-items:stretch;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.fnode{flex:1 1 150px;max-width:200px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 14px;text-align:center;font-weight:600;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.fnode small{display:block;font-weight:300;color:var(--muted);font-size:12.5px}
.outcome{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bubble{background:#D9FDD3;border-radius:12px;padding:10px 14px;font-size:14px;color:#111}
.outcome.no .bubble{background:#fff;border:1px solid var(--line)}

/* human */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.checks{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.checks li{position:relative;padding-inline-start:34px;font-size:15px}
.checks li::before{content:"✓";position:absolute;inset-inline-start:0;top:1px;width:22px;height:22px;border-radius:50%;background:#E6EFFD;color:var(--purple-d);display:grid;place-items:center;font-size:12px;font-weight:700}
.hand{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.lane{font-size:12px;font-weight:600;color:var(--purple-d);letter-spacing:.04em}
.arrow{text-align:center;color:var(--purple);font-size:22px;animation:float 2.4s ease-in-out infinite}
.tg{background:#EAF3FF;border:1px solid #CFE2FB;border-radius:14px;padding:14px;font-size:13.5px}.tg b{display:block;margin-bottom:4px}
.hand .msg{box-shadow:none;animation:none}

/* estimator */
.est{margin-top:44px;background:linear-gradient(135deg,#0A1430,#16327A);color:#fff;border-radius:28px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:center}
.est h3{color:#fff;font-size:22px;margin-bottom:6px}.est p{color:#C7D5F2;font-size:14.5px;font-weight:300}
.field{margin-top:20px}.field label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:#E2EBFF}
input[type=range]{width:100%;accent-color:#60A5FA;height:6px}
.est-out{text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(96,165,250,.3);border-radius:22px;padding:26px}
.big{font-size:clamp(44px,6vw,68px);font-weight:700;font-family:'Montserrat',sans-serif;background:linear-gradient(100deg,#93C5FD,#67E8F9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}

/* FAQ */
.faq{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.qa{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.qa button{width:100%;text-align:start;padding:18px 22px;font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.qa button::after{content:"+";font-size:22px;color:var(--purple);transition:.3s;flex:none}
.qa button[aria-expanded=true]::after{transform:rotate(45deg)}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.ans>div{overflow:hidden}.ans p{padding:0 22px 20px;color:var(--muted);font-size:14.5px;font-weight:300}
.qa button[aria-expanded=true]+.ans{grid-template-rows:1fr}

/* CTA + footer */
.final{background:linear-gradient(135deg,#0A1430,#15337E 60%,#0E7490);color:#fff;border-radius:32px;padding:clamp(34px,6vw,72px) 24px;text-align:center;position:relative;overflow:hidden}
.final::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(#2563EB,transparent 70%);top:-200px;inset-inline-end:-100px;opacity:.6}
.final>*{position:relative}.final h2{color:#fff;max-width:720px;margin:0 auto 14px}.final p{color:#D3E0F8;max-width:560px;margin:0 auto 28px;font-weight:300}
.final .btn{background:#fff;color:var(--purple-d)}
.cnote{display:none;margin-top:16px;font-size:13px;color:#FDE68A}.cnote.show{display:inline-block}
footer{border-top:1px solid var(--line);padding:44px 0 26px;background:#fff}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
.foot p{color:var(--muted);font-size:14px;margin-top:12px;max-width:340px;font-weight:300}
.foot h4{font-size:14px;margin-bottom:12px}.foot a:not(.logo){display:block;color:var(--muted);font-size:14px;padding:3px 0}.foot a:not(.logo):hover{color:var(--purple-d)}
.copy{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;bottom:24px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:none}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}.d1{transition-delay:.12s}.d2{transition-delay:.24s}

/* MARKETING */
.mk-intro{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px;margin:0 auto 34px}
.mk-pill-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.mk-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:34px;align-items:start;max-width:980px;margin-inline:auto}
.phone{width:100%;max-width:340px;margin-inline:auto;background:#0A1430;border-radius:38px;padding:10px;box-shadow:0 40px 80px -30px rgba(30,64,175,.6),0 0 0 1px rgba(59,130,246,.4);position:relative}
.phone::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:20px;background:#0A1430;border-radius:0 0 14px 14px;z-index:3}
.screen{border-radius:30px;overflow:hidden;background:#EFEAE2}
.screen .wa-top{padding-top:26px}
.screen .chat{min-height:440px;max-height:440px;overflow:hidden;justify-content:flex-end}
.compose{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#F0F0F0}
.compose span{flex:1;background:#fff;border-radius:99px;padding:7px 14px;font-size:12px;color:#8A8A8A}
.compose i{width:32px;height:32px;border-radius:50%;background:#075E54;display:block}
.mmsg{max-width:88%;min-width:min(240px,88%);padding:6px;border-radius:12px;font-size:13px;line-height:1.55;animation:pop .45s both;box-shadow:0 1px 1px rgba(0,0,0,.1);background:#D9FDD3;align-self:flex-end;border-top-inline-end-radius:3px;color:#111;white-space:pre-line}
.mmsg .txt{padding:2px 6px 0}
.mmsg .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:#667781;padding:2px 6px 0}
.tick{font-size:12px;letter-spacing:-3px;color:#8696A0;transition:.5s}.tick.read{color:#34B7F1}
.mimg{height:128px;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2563EB,#3B82F6 55%,#06B6D4)}
.mimg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px)}
.mimg b{position:absolute;bottom:8px;inset-inline-start:10px;color:#fff;font-size:12px;font-weight:600;background:rgba(11,18,48,.55);padding:2px 9px;border-radius:99px}
.mimg.off{background:linear-gradient(135deg,#64748B,#334155)}
.mfile{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.65);border-radius:9px;padding:9px 10px}
.mfile .ic{width:34px;height:40px;border-radius:6px;background:#EF4444;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:'Montserrat',sans-serif}
.mfile div b{display:block;font-size:12.5px}.mfile div small{font-size:11px;color:#667781}
.mbtn{margin-top:4px;text-align:center;color:#0A7FBF;font-weight:600;font-size:13px;padding:7px;border-top:1px solid rgba(0,0,0,.08)}
.typing{align-self:flex-end;background:#D9FDD3;border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#7A8B85;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
.panel{min-width:0;display:flex;flex-direction:column;gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.pcard h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.aud{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:14px}
.aud b{font-family:'Montserrat',sans-serif;font-size:20px;color:var(--purple-d)}
.bar{height:10px;border-radius:99px;background:#E0EAFB;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2563EB,#06B6D4);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Montserrat',sans-serif;font-size:19px;color:var(--ink)}.stat span{font-size:11.5px;color:var(--muted)}
.appr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.appr .tg{flex:1 1 220px;background:#EAF3FF}
.appr .st{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:#FEF3C7;color:#92400E;transition:.4s}
.appr .st.ok{background:#D1FAE5;color:#065F46}
.consent{display:flex;gap:10px;align-items:flex-start;background:#F0FDF4;border:1px solid #BBF7D0;color:#14532D;border-radius:16px;padding:14px 16px;font-size:13.5px;font-weight:300}
.consent b{font-weight:600}
.mflow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:38px}
.xx{flex:1 1 140px;max-width:180px;padding:16px 10px}

/* email mock */
.mail{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);width:100%}
.mail-top{display:flex;gap:7px;align-items:center;padding:12px 16px;background:#EFF3FA;border-bottom:1px solid var(--line)}
.mail-top i{width:10px;height:10px;border-radius:50%;background:#D3DBEA}.mail-top span{margin-inline-start:10px;font-size:12px;color:var(--muted);font-family:'Montserrat',sans-serif}
.mail-head{padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;display:grid;gap:4px}
.mail-head div{display:flex;gap:8px}.mail-head span{color:var(--muted);min-width:56px}.mail-head b{font-weight:600}
.mail-body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:380px}
.mpart{opacity:0;transform:translateY(12px);transition:.55s}.mpart.on{opacity:1;transform:none}
.mbanner{height:130px;border-radius:14px;background:linear-gradient(135deg,#0A1430,#15337E 55%,#3B82F6);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.mbanner::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px)}
.mbanner b{position:relative;color:#fff;font-size:17px}
.mrows{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px}
.sw{width:38px;height:38px;border-radius:9px;flex:none}
.mrow div{flex:1}.mrow div small{display:block;color:var(--muted);font-size:11.5px}
.mrow em{font-style:normal;font-weight:700;font-family:'Montserrat',sans-serif;font-size:13px}
.mrow s{color:var(--muted);font-weight:400;margin-inline-end:6px}
.mcta{align-self:flex-start;background:linear-gradient(135deg,#2563EB,#0E7490);color:#fff;padding:10px 22px;border-radius:12px;font-weight:600;font-size:14px}
.mfoot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.mfoot u{color:var(--purple-d)}
.mail-wrap{display:flex;flex-direction:column;gap:16px}
.sent-chip{display:flex;align-items:center;gap:10px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:99px;padding:8px 16px;font-size:13px;color:#14532D;font-weight:600;align-self:flex-start;opacity:0;transform:translateY(8px);transition:.5s}
.sent-chip.on{opacity:1;transform:none}


/* TIMELINE (steps on one line) */
.tl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative;max-width:1000px;margin:0 auto 36px}
.tl::before,.tl::after{content:"";position:absolute;top:32px;inset-inline:calc(100% / (var(--n) * 2));height:3px;border-radius:3px}
.tl::before{background:#DCE6F8}
.tl::after{background:linear-gradient(90deg,#2563EB,#06B6D4);transform:scaleX(0);transform-origin:left;transition:transform 1.8s cubic-bezier(.3,.7,.2,1) .3s}
[dir=rtl] .tl::after{transform-origin:right}
.tl.in::after{transform:scaleX(1)}
.tl .st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0 6px}
.tl .st .tile{width:64px;height:64px;border-radius:20px;box-shadow:0 0 0 7px var(--bg),0 14px 28px -10px rgba(30,64,175,.6),inset 0 0 14px rgba(59,130,246,.25)}
section.alt .tl .st .tile,section.demo .tl .st .tile{box-shadow:0 0 0 7px #F5F8FE,0 14px 28px -10px rgba(30,64,175,.6),inset 0 0 14px rgba(59,130,246,.25)}
.tl .st .tile svg{width:28px;height:28px}
.tl .no{position:absolute;top:-6px;inset-inline-end:calc(50% - 40px);width:22px;height:22px;border-radius:50%;background:#fff;color:var(--purple-d);border:1.5px solid #BFD3F8;font:700 11px 'Montserrat',sans-serif;display:grid;place-items:center;z-index:2}
.tl b{font-size:14.5px;font-weight:600;line-height:1.4}
.tl small{font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.5}

/* SYSTEM OVERVIEW */
.sys{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.sys .card{display:flex;flex-direction:column}
.sys .link{align-self:center;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid #BFD3F8;color:var(--purple);font-size:20px;box-shadow:0 8px 20px -8px rgba(30,64,175,.4)}
.sys .card .go{margin-top:auto;padding-top:18px;font-weight:600;color:var(--purple-d);font-size:14px}
.sys .num{font:700 12px 'Montserrat',sans-serif;color:var(--purple-d);margin-bottom:10px;letter-spacing:.06em}
.mband{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#EAF2FF,#E7FAFA);border:1px solid #CFE0FB;border-radius:22px;padding:16px 22px;margin-bottom:44px}
.mband .mn{font:700 13px 'Montserrat',sans-serif;color:#fff;background:linear-gradient(135deg,#2563EB,#0891B2);border-radius:99px;padding:5px 14px;white-space:nowrap}
.mband h3{font-size:clamp(15px,1.8vw,18px)}.mband p{font-size:13.5px;color:var(--muted);font-weight:300;margin-top:2px}
.mband .nx{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--purple-d);white-space:nowrap}

/* SCENARIO CARDS */
.scards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:960px;margin:0 auto 28px}
.sc{display:flex;align-items:center;gap:14px;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;transition:.25s;font-weight:600;font-size:15px}
.sc:hover{border-color:#93C5FD;transform:translateY(-2px)}
.sc[aria-selected=true]{border-color:#2563EB;background:linear-gradient(180deg,#fff,#EEF4FF);box-shadow:0 14px 30px -14px rgba(37,99,235,.55)}
.sc .tile{width:44px;height:44px;border-radius:14px}.sc .tile svg{width:22px;height:22px}

/* TRACKING */
.trk{list-style:none;display:flex;flex-direction:column;gap:8px}
.trk li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;background:var(--bg2);border-radius:12px;padding:8px 12px}
.trk .c{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#E5E9F2;color:#64748B;transition:.4s;white-space:nowrap}
.trk .c.on{background:#D1FAE5;color:#065F46}

/* RESPONSIVE */
@media (max-width:1020px){
  .g4{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}
  .hero-grid{grid-template-columns:1fr;gap:30px}.hero-grid>div:first-child{text-align:center}.hero .lead{margin-inline:auto}.cta-row{justify-content:center}
  .orbit{min-height:440px}
  .mk-grid{grid-template-columns:minmax(0,1fr);max-width:640px}
  .split{grid-template-columns:1fr;gap:30px}
  .est{grid-template-columns:1fr}
}
@media (max-width:860px){
  .links,.nav-actions .btn{display:none}.burger{display:block}
  .demo-grid{grid-template-columns:minmax(0,1fr)!important;max-width:560px}
  .mk-intro{grid-template-columns:1fr}
  .sys{grid-template-columns:minmax(0,1fr);gap:8px}.sys .link{transform:rotate(90deg);justify-self:center}
  .mband{flex-wrap:wrap}.mband .nx{margin-inline-start:0}
}
@media (max-width:640px){
  .g2,.g3,.g4,.steps{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr}
  .orbit{min-height:420px}.order-card{width:180px;inset-inline-end:0}.fl .tile{width:42px;height:42px}.fl .tile.lg{width:48px;height:48px}.f5{display:none}
  .arr{width:2px;height:28px}.steps3{flex-direction:column}
  .card{padding:22px}.fnode{flex-basis:130px}.tab{padding:9px 14px;font-size:13px}
  .stats{gap:6px}.mail-body{padding:16px}
  .scards{gap:8px}.sc{flex-direction:column;text-align:center;padding:14px 6px;gap:8px;font-size:12.5px;line-height:1.35}.sc .tile{width:40px;height:40px}
  .tl::before,.tl::after{top:22px}.tl .st{gap:6px;padding:0 2px}.tl .st .tile{width:44px;height:44px;border-radius:14px;box-shadow:0 0 0 5px var(--bg)}
  section.alt .tl .st .tile,section.demo .tl .st .tile{box-shadow:0 0 0 5px #F5F8FE}
  .tl .st .tile svg{width:21px;height:21px}.tl b{font-size:11.5px}.tl small{display:none}.tl .no{display:none}
}

@media (max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){
  section{padding:46px 0}.head{margin-bottom:28px}
  h1{font-size:25px}h2{font-size:21px}h3{font-size:15px}
  html[lang="en"] h1{font-size:25px}html[lang="en"] h2{font-size:20px}
  .lead{font-size:14px}.card p,.step p,.pcard p{font-size:13px}.note,.trust{font-size:12px}
  .kicker{font-size:11.5px;padding:5px 12px}
  .logo{font-size:16px}.logo-mark{width:32px;height:32px;border-radius:10px}
  .lang{padding:7px 11px;font-size:12.5px}.burger{width:38px;height:38px}.burger span{top:17px}
  .tile{width:40px;height:40px;border-radius:13px}.tile svg{width:20px;height:20px}.tile.lg{width:48px;height:48px}.tile.mb{margin-bottom:12px}
  .card{padding:18px;border-radius:18px}.ftop{margin-bottom:12px}.badge{font-size:10.5px;padding:3px 8px}
  .btn{padding:11px 20px;font-size:14px}.cta-row{gap:8px}.cta-row .btn{flex:1 1 100%}
  .track{font-size:18px;margin-bottom:24px}.ring{width:68px;height:68px}.ring svg{width:26px;height:26px}.s3 b{font-size:14px}
  .orbit{min-height:370px}.wa{width:88%}.chat{min-height:250px;padding:10px 8px}.msg{font-size:12.5px;padding:7px 10px}
  .order-card{width:158px;padding:11px;bottom:0}.order-card h4{font-size:12px}.order-card .row{font-size:11px}.mini-actions span{font-size:11px;padding:4px}
  .f4{bottom:4%;inset-inline-start:0}
  .demo-chat .chat{min-height:300px}.demo-side,.pcard{padding:18px;border-radius:18px}.actions li{font-size:13px}
  .scards{gap:6px}.sc{padding:12px 4px;font-size:11.5px;border-radius:16px}.sc .tile{width:34px;height:34px;border-radius:11px}.sc .tile svg{width:17px;height:17px}
  .tl .st .tile{width:38px;height:38px;border-radius:12px}.tl .st .tile svg{width:18px;height:18px}.tl::before,.tl::after{top:19px}.tl b{font-size:10.5px}
  .mband{padding:14px;gap:10px;border-radius:18px}.mband .tile{width:36px;height:36px}.mband .mn{font-size:11.5px;padding:4px 10px}.mband p{font-size:12px}
  .sys .link{width:36px;height:36px;font-size:16px}
  .phone{max-width:300px;border-radius:32px;padding:8px}.screen{border-radius:25px}.screen .chat{min-height:380px;max-height:380px}.mmsg{font-size:12px}.mimg{height:104px}
  .stat b{font-size:16px}.stat span{font-size:10.5px}.aud{font-size:12.5px}.aud b{font-size:17px}.trk li{font-size:12px;padding:7px 10px}.trk .c{font-size:10.5px;padding:2px 8px}
  .mail-head{padding:12px 14px;font-size:12px}.mail-head span{min-width:46px}.mail-body{padding:14px;gap:11px}.mbanner{height:100px}.mbanner b{font-size:15px}.mrow{font-size:12.5px;padding:7px 10px}.sw{width:32px;height:32px}.mcta{font-size:13px;padding:9px 18px}
  .fnode{padding:16px 10px;font-size:13px}.outcome{padding:18px}.bubble{font-size:13px}
  .hand,.step{padding:18px}.step .n{width:34px;height:34px}.checks li{font-size:13.5px}
  .est{padding:20px;border-radius:22px}.est h3{font-size:18px}.est p{font-size:13px}.est-out{padding:18px}.big{font-size:42px}.field label{font-size:13px}
  .qa button{padding:14px 16px;font-size:14px}.ans p{padding:0 16px 16px;font-size:13px}
  .final{border-radius:24px}.final p{font-size:14px}
  .foot p,.foot a:not(.logo){font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.mpart{opacity:1;transform:none}.sent-chip{opacity:1}html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>

<header class="nav" id="nav">
  <div class="container nav-in">
    <a href="#top" class="logo" aria-label="Wassel AI"><span class="logo-mark">W</span><span>Wassel AI</span></a>
    <nav class="links" aria-label="Main">
      <a href="#how" data-i18n="nav1"></a>
      <a href="#features" data-i18n="nav2"></a>
      <a href="#wa-mk" data-i18n="nav5"></a>
      <a href="#em-mk" data-i18n="nav6"></a>
      <a href="#usecases" data-i18n="nav3"></a>
      <a href="#faq" data-i18n="nav4"></a>
    </nav>
    <div class="nav-actions">
      <button class="lang" id="langBtn" type="button"></button>
      <a class="btn btn-primary btn-sm js-demo" href="#contact" data-i18n="cta"></a>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="mnav" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>
<div class="mnav" id="mnav">
  <a href="#how" data-i18n="nav1"></a>
  <a href="#features" data-i18n="nav2"></a>
  <a href="#wa-mk" data-i18n="nav5"></a>
  <a href="#em-mk" data-i18n="nav6"></a>
  <a href="#usecases" data-i18n="nav3"></a>
  <a href="#faq" data-i18n="nav4"></a>
  <a class="btn btn-primary js-demo" href="#contact" data-i18n="cta"></a>
</div>

<main id="main">
<!-- HERO -->
<section class="hero" id="top">
  <div class="container hero-grid">
    <div>
      <span class="kicker" data-i18n="kicker"></span>
      <h1><span data-i18n="h1a"></span> <span class="grad" data-i18n="h1b"></span></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="cta-row">
        <a class="btn btn-primary js-demo" href="#contact" data-i18n="cta"></a>
        <a class="btn btn-ghost" href="#demo" data-i18n="cta2"></a>
      </div>
      <p class="trust" data-i18n="trust"></p>
    </div>
    <div class="orbit" aria-label="Product preview">
      <span class="fl f4"><span class="tile" data-icon="bars"></span></span>
      <span class="fl f5"><span class="tile t-blue" data-icon="user"></span></span>
      <span class="sim-tag" data-i18n="simTag"></span>
      <div class="wa">
        <div class="wa-top"><div class="wa-av">W</div><div><b>Wassel AI</b><small data-i18n="online"></small></div></div>
        <div class="chat" id="heroChat"></div>
      </div>
      <div class="order-card">
        <h4><span data-i18n="oc0"></span><span class="pill wait" data-i18n="oc5"></span></h4>
        <div class="row"><span data-i18n="oc1"></span><b data-i18n="oc1v"></b></div>
        <div class="row"><span data-i18n="oc2"></span><b>A01 / A1001</b></div>
        <div class="row"><span data-i18n="oc3"></span><b data-i18n="oc3v"></b></div>
        <div class="mini-actions"><span class="y" data-i18n="ok"></span><span class="n" data-i18n="no"></span></div>
      </div>
    </div>
  </div>
</section>

<!-- WAVE STRIP -->
<section class="strip" aria-label="Value">
  <div class="container">
    <p class="track reveal" data-i18n="tag"></p>
    <div class="steps3 reveal d1">
      <div class="s3"><span class="ring t-blue" data-icon="clock"></span><b data-i18n="s3a"></b></div>
      <span class="arr" aria-hidden="true"></span>
      <div class="s3"><span class="ring t-cyan" data-icon="bolt"></span><b data-i18n="s3b"></b></div>
      <span class="arr" aria-hidden="true"></span>
      <div class="s3"><span class="ring" data-icon="growth"></span><b data-i18n="s3c"></b></div>
    </div>
  </div>
</section>

<!-- PROBLEM -->
<section id="problem">

/* ===== HELPERS ===== */
let lang="ar", curNum=0, raf;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const T=()=>I18N[lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sel={d:0,w:0,e:0};
const TM={d:[],w:[],e:[]}, RAF={w:0,e:0};
const later=(k,ms,fn)=>{ if(reduce) fn(); else TM[k].push(setTimeout(fn,ms)) };
const clearSim=k=>{TM[k].forEach(clearTimeout);TM[k]=[];cancelAnimationFrame(RAF[k]||0);cancelAnimationFrame(RAF[k+"2"]||0)};
const num=n=>n.toLocaleString(lang==="ar"?"ar-EG":"en-US");

function contactHref(){
  const msg=encodeURIComponent(lang==="ar"?"مرحبًا، أريد حجز عرض تجريبي لـ Wassel AI":"Hello, I would like to book a Wassel AI demo");
  if(CONFIG.whatsapp) return `https://wa.me/${CONFIG.whatsapp.replace(/\D/g,"")}?text=${msg}`;
  if(CONFIG.email) return `mailto:${CONFIG.email}?subject=${encodeURIComponent("Wassel AI Demo")}`;
  return null;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)}

/* ===== RENDER ===== */
function render(){
  const t=T();
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"Wassel AI | خدمة عملاء وتسويق بالذكاء الاصطناعي لشركات الأقمشة والسجاد والأرضيات":"Wassel AI | AI customer service and marketing for fabric, carpet and flooring companies";
  $$("[data-i18n]").forEach(e=>{if(t[e.dataset.i18n]!==undefined)e.textContent=t[e.dataset.i18n]});
  if(lang==="ar") $$("h1 [data-i18n],h2[data-i18n],.track").forEach(e=>e.textContent=kashida(e.textContent));
  $$("[data-icon]").forEach(e=>e.innerHTML=svg(e.dataset.icon));
  $("#langBtn").textContent=lang==="ar"?"English":"العربية";
  $("#langBtn").setAttribute("aria-label",lang==="ar"?"Switch to English":"التبديل إلى العربية");
  $("#pains").innerHTML=t.pains.map((p,i)=>`<div class="card reveal in">${tile(p[0],i,"mb")}<h3>${esc(p[1])}</h3><p>${esc(p[2])}</p></div>`).join("");
  const arrow=lang==="ar"?"←":"→";
  $("#mods").innerHTML=t.mods.map((m,i)=>`<a class="card reveal in" href="${m[4]}"><div class="ftop">${tile(m[0],i)}<span class="badge ${m[3]}">${esc(t.badge[m[3]])}</span></div><span class="num">${t.modWord} ${i+1}</span><h3>${esc(m[1])}</h3><p>${esc(m[2])}</p><span class="go">${t.go} ${arrow}</span></a>`).join('<span class="link" aria-hidden="true">⇄</span>');
  $("#steps").innerHTML=t.steps.map((s,i)=>`<div class="step reveal in"><div class="n">${i+1}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
  $("#feats").innerHTML=t.feats.map((f,i)=>`<div class="card reveal in"><div class="ftop">${tile(f[0],i)}<span class="badge ${f[3]}">${esc(t.badge[f[3]])}</span></div><h3>${esc(f[1])}</h3><p>${esc(f[2])}</p></div>`).join("");
  $("#flow").innerHTML=tl(t.flow); $("#wFlow").innerHTML=tl(t.wFlow); $("#eFlow").innerHTML=tl(t.eFlow); $("#loop").innerHTML=tl(t.loop);
  t.mband.forEach((b,i)=>{$("#mb"+i).innerHTML=`<span class="mn">${t.modWord} ${b[0]}</span>${tile(b[1],i)}<div><h3>${esc(b[2])}</h3><p>${esc(b[3])}</p></div><span class="nx">${esc(b[4])}</span>`});
  $("#humList").innerHTML=t.hum.map(h=>`<li>${esc(h)}</li>`).join("");
  $("#bens").innerHTML=t.bens.map((b,i)=>`<div class="card benefit reveal in">${tile(b[0],i)}<div><h3>${esc(b[1])}</h3><p>${esc(b[2])}</p></div></div>`).join("");
  $("#uses").innerHTML=t.uses.map((u,i)=>`<div class="card reveal in">${tile(u[0],i,"mb")}<h3>${esc(u[1])}</h3><p>${esc(u[2])}</p></div>`).join("");
  $("#faqList").innerHTML=t.faq.map((q,i)=>`<div class="qa reveal in"><button type="button" id="q${i}" aria-expanded="false" aria-controls="a${i}">${esc(q[0])}</button><div class="ans" id="a${i}" role="region" aria-labelledby="q${i}"><div><p>${esc(q[1])}</p></div></div></div>`).join("");
  const SI={d:["box","doc","people"],w:["layers","tag","alert"],e:["layers","tag","alert"]};
  const tabs=(k,arr)=>arr.map((s,i)=>`<button class="sc" role="tab" type="button" data-k="${k}" data-i="${i}" aria-selected="${i===sel[k]}">${tile(SI[k][i],i)}<span>${esc(s.n)}</span></button>`).join("");
  $("#tabs").innerHTML=tabs("d",t.scen); $("#wTabs").innerHTML=tabs("w",t.wScen); $("#eTabs").innerHTML=tabs("e",t.eScen);
  $("#wConsent").textContent=t.wCons; $("#eConsent").textContent=t.eCons;
  heroChat(); playDemo(); playW(); playE(); calc(); contacts();
}

const tl=arr=>arr.map((f,i)=>`<div class="st">${tile(f[0],i)}<span class="no">${i+1}</span><b>${esc(f[1])}</b><small>${esc(f[2])}</small></div>`).join("");
function bubble(box,kind,text){
  const d=document.createElement("div");
  if(kind==="sys"){d.className="msg sys";d.textContent=text}
  else{
    d.className="msg "+kind;
    if(text.startsWith("IMG|")){d.innerHTML='<span class="po-thumb"></span>'+esc(text.slice(4))}
    else d.textContent=text;
  }
  box.appendChild(d);
}
function heroChat(){
  const box=$("#heroChat"); box.innerHTML="";
  T().chat.forEach((m,i)=>{bubble(box,m[0],m[1]);box.lastChild.style.animationDelay=(0.3+i*0.5)+"s"});
}
function lit(list,upTo){for(let k=0;k<list.children.length;k++)list.children[k].classList.toggle("on",k<=upTo)}

/* ----- customer-service demo ----- */
function playDemo(){
  clearSim("d");
  const s=T().scen[sel.d], box=$("#demoChat"), list=$("#actions");
  box.innerHTML=""; list.innerHTML=s.a.map(a=>`<li><i>✓</i><span>${esc(a)}</span></li>`).join("");
  s.m.forEach((m,i)=>{
    later("d",500+i*1300,()=>{bubble(box,m[1],m[2]);lit(list,i===s.m.length-1?99:m[0])});
  });
}

/* ----- counter + tracking used by marketing sims ----- */
const ST={w:{sent:0,open:0,N:0},e:{sent:0,open:0,N:0}};
function paint(p){
  const s=ST[p]; $(`#${p}Cnt`).textContent=`${num(s.sent)} / ${num(s.N)}`; $(`#${p}Bar`).style.width=(s.N?s.sent/s.N*100:0)+"%";
  $(`#${p}S2`).textContent=num(s.open); $(`#${p}S3`).textContent=num(s.sent-s.open);
}
function tween(key,from,to,dur,fn){
  cancelAnimationFrame(RAF[key]||0); const st=performance.now();
  const step=n=>{const f=reduce?1:Math.min((n-st)/dur,1),e=1-Math.pow(1-f,3);fn(Math.round(from+(to-from)*e));if(f<1)RAF[key]=requestAnimationFrame(step)};
  RAF[key]=requestAnimationFrame(step);
}
function count(k,p,N,dur){ tween(k,0,N,dur,v=>{ST[p].sent=v;paint(p)}) }
function resetStats(p,N,aud){
  ST[p]={sent:0,open:0,N}; $(`#${p}AudL`).textContent=aud; $(`#${p}S1`).textContent=num(N); paint(p);
  const t=T(), lab=p==="w"?t.rowW:t.rowE;
  $(`#${p}Trk`).innerHTML=t.trkN.map(n=>`<li><span>${esc(n)}</span><span class="c">${esc(lab[1])}</span></li>`).join("");
}
/* after sending ends: recipients open the message one by one and the counter follows */
function track(k,p,delay){
  const t=T(), lab=p==="w"?t.rowW:t.rowE, rows=$(`#${p}Trk`).children, N=ST[p].N, target=Math.round(N*.62);
  [0,1,3].forEach((r,n)=>later(k,delay+n*900,()=>{const c=rows[r].lastChild;c.textContent=lab[0];c.classList.add("on")}));
  later(k,delay,()=>tween(k+"2",0,target,2400,v=>{ST[p].open=v;paint(p)}));
}

/* ----- WhatsApp marketing (live screen) ----- */
function mBubble(m,i){
  const d=document.createElement("div"); d.className="mmsg";
  let h="";
  if(m.img) h+=`<div class="mimg ${m.off?"off":""}"><b>${esc(m.img)}</b></div>`;
  if(m.file) h+=`<div class="mfile"><span class="ic">PDF</span><div><b>${esc(m.file[0])}</b><small>${esc(m.file[1])}</small></div></div>`;
  if(m.t) h+=`<div class="txt">${esc(m.t)}</div>`;
  h+=`<div class="meta">10:2${i+4} <span class="tick">✓</span></div>`;
  if(m.btn) h+=`<div class="mbtn">${esc(m.btn)}</div>`;
  d.innerHTML=h; return d;
}
function playW(){
  clearSim("w");
  const t=T(), s=t.wScen[sel.w], box=$("#wChat"), list=$("#wActions"), st=$("#wSt");
  box.innerHTML=""; list.innerHTML=s.a.map(a=>`<li><i>✓</i><span>${esc(a)}</span></li>`).join("");
  resetStats("w",s.N,s.aud);
  $("#wApprTxt").textContent=s.appr; st.textContent=t.apprWait; st.classList.remove("ok");
  later("w",300,()=>lit(list,1));
  later("w",1500,()=>{lit(list,2);st.textContent=t.apprOk;st.classList.add("ok")});
  let at=2400, counted=false;
  s.m.forEach((m,i)=>{
    const ty=document.createElement("div"); ty.className="typing"; ty.innerHTML="<i></i><i></i><i></i>";
    later("w",at,()=>{ if(!reduce) box.appendChild(ty); lit(list,m.s); if(!counted){counted=true;count("w","w",s.N,2600)} });
    later("w",at+(reduce?0:800),()=>{
      ty.remove(); const el=mBubble(m,i); box.appendChild(el);
      const tk=el.querySelector(".tick");
      later("w",500,()=>{tk.textContent="✓✓"});
      later("w",1500,()=>{tk.classList.add("read")});
      if(i===s.m.length-1){lit(list,99);track("w","w",1800)}
    });
    at+=1700;
  });
  
}

/* ----- Email marketing (live mail) ----- */
function playE(){
  clearSim("e");
  const t=T(), s=t.eScen[sel.e], body=$("#mBody"), list=$("#eActions"), chip=$("#eSent");
  list.innerHTML=s.a.map(a=>`<li><i>✓</i><span>${esc(a)}</span></li>`).join("");
  resetStats("e",s.N,s.to); chip.classList.remove("on"); chip.textContent="✓ "+s.sent;
  $("#mTo").textContent=s.to; $("#mSubj").textContent=s.subj;
  const rows=s.rows.map(r=>`<div class="mrow"><span class="sw" style="background:${r[0]}"></span><div><b>${esc(r[1])}</b><small>${esc(r[2])}</small></div><em>${r[3]?`<s>${esc(r[3])}</s>`:""}${esc(r[4])}</em></div>`).join("");
  body.innerHTML=
   `<div class="mpart mbanner"><b>${esc(s.banner)}</b></div>`+
   `<p class="mpart">${esc(s.intro)}</p>`+
   `<div class="mpart mrows">${rows}</div>`+
   `<a class="mpart mcta" href="#em-mk" onclick="return false">${esc(s.cta)}</a>`+
   `<div class="mpart mfoot">${esc(t.unsub)} <u>${esc(t.unsubL)}</u></div>`;
  const parts=body.children;
  later("e",300,()=>lit(list,0));
  for(let i=0;i<parts.length;i++) later("e",500+i*650,()=>{parts[i].classList.add("on"); if(i===1)lit(list,1); if(i===2)lit(list,2)});
  later("e",500+parts.length*650,()=>{lit(list,3);count("e","e",s.N,2400)});
  later("e",500+parts.length*650+2600,()=>{lit(list,99);chip.classList.add("on");track("e","e",300)});
  
}

/* ===== ESTIMATOR ===== */
function calc(){
  const m=+$("#r1").value, mi=+$("#r2").value, p=+$("#r3").value;
  $("#v1").textContent=m;$("#v2").textContent=mi;$("#v3").textContent=p;
  const to=Math.round(m*mi*(p/100)*26/60), from=curNum, st=performance.now();
  cancelAnimationFrame(raf);
  (function step(n){const k=Math.min((n-st)/500,1),e=1-Math.pow(1-k,3);curNum=Math.round(from+(to-from)*e);
    $("#estOut").textContent=num(curNum);if(k<1)raf=requestAnimationFrame(step)})(st);
}

/* ===== CONTACT ===== */
function contacts(){
  const h=contactHref();
  const w=$("#fWa"), m=$("#fMail");
  if(CONFIG.whatsapp){w.hidden=false;w.href=`https://wa.me/${CONFIG.whatsapp.replace(/\D/g,"")}`;w.textContent="WhatsApp: +"+CONFIG.whatsapp.replace(/\D/g,"")}else w.hidden=true;
  if(CONFIG.email){m.hidden=false;m.href="mailto:"+CONFIG.email;m.textContent=CONFIG.email}else m.hidden=true;
  $$(".js-demo").forEach(a=>{if(h){a.href=h;a.target="_blank";a.rel="noopener"}else{a.href="#contact";a.removeAttribute("target")}});
}

/* ===== EVENTS ===== */
document.addEventListener("click",e=>{
  const demo=e.target.closest(".js-demo");
  if(demo&&!contactHref()){
    e.preventDefault();
    $("#contact").scrollIntoView({behavior:"smooth"});
    $("#cnote").classList.add("show"); toast(T().toastOff);
  }
  const tab=e.target.closest(".sc");
  if(tab){
    const k=tab.dataset.k; sel[k]=+tab.dataset.i;
    tab.parentElement.querySelectorAll(".sc").forEach(b=>b.setAttribute("aria-selected",b===tab));
    ({d:playDemo,w:playW,e:playE})[k]();
  }
  const q=e.target.closest(".qa button");
  if(q){const open=q.getAttribute("aria-expanded")==="true";$$(".qa button").forEach(b=>b.setAttribute("aria-expanded","false"));q.setAttribute("aria-expanded",String(!open))}
  if(e.target.closest("#mnav a")) setMenu(false);
});
$("#replay").addEventListener("click",playDemo);
$("#wReplay").addEventListener("click",playW);
$("#eReplay").addEventListener("click",playE);
$("#langBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";render()});
["r1","r2","r3"].forEach(id=>$("#"+id).addEventListener("input",calc));

function setMenu(open){$("#nav").classList.toggle("open",open);$("#burger").setAttribute("aria-expanded",String(open))}
$("#burger").addEventListener("click",()=>setMenu($("#burger").getAttribute("aria-expanded")!=="true"));
addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false)});
addEventListener("resize",()=>{if(innerWidth>860)setMenu(false)});
addEventListener("scroll",()=>$("#nav").classList.toggle("scrolled",scrollY>20),{passive:true});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
$$(".reveal").forEach(el=>io.observe(el));

const seen={};
const sio=new IntersectionObserver(es=>es.forEach(e=>{const k=e.target.dataset.sim;if(e.isIntersecting&&!seen[k]){seen[k]=1;({d:playDemo,w:playW,e:playE})[k]();sio.unobserve(e.target)}}),{threshold:.3});
[["#demo","d"],["#wa-mk","w"],["#em-mk","e"]].forEach(([id,k])=>{const el=$(id);el.dataset.sim=k;sio.observe(el)});

$("#yr").textContent=new Date().getFullYear();
render();
</script>
